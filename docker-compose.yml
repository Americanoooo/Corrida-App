services:
    db:
      image: mysql:8
      environment:
          MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
          MYSQL_DATABASE: app_corrida
      ports:
        - "3307:3306"
      volumes:
        - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
        - dados_mysql:/var/lib/mysql
      healthcheck:                                    
        test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 180s

    app:
      build: ./backend
      ports: 
        - "3000:3000"
      environment:
        DB_HOST: db
        DB_USER: root
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: app_corrida
        DB_PORT: 3306
        JWT_SECRET: ${JWT_SECRET} 
      depends_on: 
        db:
          condition: service_healthy

volumes:
  dados_mysql:
